name: Publish VulkanOS PC Dashboard Alpha Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-vulkanos-release.yml"
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID da execução bem-sucedida de Build VulkanOS PC Alpha"
        required: false
        default: "45919988737"
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish dashboard ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout VulkanOS
        uses: actions/checkout@v4

      - name: Download dashboard build artifact
        uses: actions/download-artifact@v4
        with:
          name: VulkanOS-PC-Alpha-0.1-amd64
          path: release-assets
          run-id: ${{ inputs.run_id || '45919988737' }}
          github-token: ${{ github.token }}

      - name: Verify ISO and prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          OLD_ISO="release-assets/VulkanOS-PC-Alpha-0.1-amd64.iso"
          ISO="release-assets/VulkanOS-PC-Alpha-0.2-amd64.iso"
          test -s "$OLD_ISO"
          test -s release-assets/SHA256SUMS
          test -s release-assets/dashboard-preview.png
          (cd release-assets && sha256sum -c SHA256SUMS)

          mv "$OLD_ISO" "$ISO"
          sed -i 's/VulkanOS-PC-Alpha-0.1-amd64.iso/VulkanOS-PC-Alpha-0.2-amd64.iso/' release-assets/SHA256SUMS
          cp LICENSE-ALPHA-0.1.txt release-assets/LICENSE-VULKANOS-ALPHA.txt

          SIZE=$(stat -c %s "$ISO")
          if (( SIZE > 1800000000 )); then
            split -b 1800M -d -a 2 "$ISO" "$ISO.part-"
            rm "$ISO"
            cat > release-assets/REASSEMBLE.txt <<'EOF'
          VulkanOS PC Alpha 0.2 — reconstruir a ISO

          Baixe TODAS as partes .iso.part-00, .iso.part-01, etc. para a mesma pasta.

          Windows CMD:
          copy /b VulkanOS-PC-Alpha-0.2-amd64.iso.part-00+VulkanOS-PC-Alpha-0.2-amd64.iso.part-01 VulkanOS-PC-Alpha-0.2-amd64.iso

          Linux/macOS:
          cat VulkanOS-PC-Alpha-0.2-amd64.iso.part-* > VulkanOS-PC-Alpha-0.2-amd64.iso

          Depois confira o SHA-256 usando SHA256SUMS.
          Linux: sha256sum -c SHA256SUMS
          Windows PowerShell: Get-FileHash .\VulkanOS-PC-Alpha-0.2-amd64.iso -Algorithm SHA256
          O resultado deve ser igual ao valor em SHA256SUMS.
          EOF
          else
            touch release-assets/REASSEMBLE.txt
          fi

          ls -lh release-assets
          expected_sha="$(awk 'NR==1 {print $1}' release-assets/SHA256SUMS)"
          actual_sha="$(cat "$ISO.part-"* | sha256sum | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"
          echo "ISO reconstruida a partir das partes: SHA-256 OK ($actual_sha)"

      - name: Write release notes
        shell: bash
        run: |
          cat > RELEASE-NOTES.md <<'EOF'
          # VulkanOS PC Alpha 0.2 — Dashboard Edition

          Esta versão contém a nova interface própria do VulkanOS em estilo console, com tema escuro em vermelho e preto.

          ## O que há nesta ISO
          - Dashboard com Biblioteca, Emuladores, Navegador, Steam, Configurações e Sobre.
          - Indicadores de rede, controles, Bluetooth e bateria.
          - Cartões para Steam, RetroArch, ES-DE, Hydra Launcher e Firefox.
          - Lista básica de jogos Steam instalados e ROMs encontradas em ~/ROMs.
          - Navegação básica por teclado e joysticks Linux (/dev/input/js*).
          - ES-DE continua como frontend de emulação e é aberto pelo dashboard.

          ## Base e limitações
          Continua sendo um sistema baseado em Debian 13 (Trixie) com XFCE e componentes de jogos. O dashboard é experimental e não foi validado em hardware físico nesta publicação. O suporte a controles não é universal. Assistente BOOT/VKROMS, RUNVK, kernel/drivers próprios e ports específicos ainda não existem. Esta ISO é apenas para PCs amd64, não para handhelds ARM.

          ## Download
          Como a ISO ultrapassa o limite de tamanho por arquivo do GitHub Releases, ela está dividida em partes .iso.part-00, .iso.part-01 etc. Baixe todas as partes e una-as conforme REASSEMBLE.txt. Depois valide o arquivo reconstruído com SHA256SUMS.

          O arquivo dashboard-preview.png mostra a prévia gerada automaticamente no teste virtual 1280x720; não é uma foto de execução em hardware físico.

          Teste primeiro em modo Live com um pendrive separado. Gravar ou instalar a ISO pode apagar dados. Faça backup e confira o dispositivo selecionado. Nenhuma ROM, BIOS ou jogo está incluído.

          ## Licença
          Os materiais originais VulkanOS estão sujeitos à licença personalizada de avaliação e compartilhamento incluída como LICENSE-VULKANOS-ALPHA.txt. Componentes de terceiros continuam sujeitos às respectivas licenças. Esta licença não é open source.
          EOF

      - name: Publish GitHub Release with ISO assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.2.0-alpha.1"
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "VulkanOS PC Alpha 0.2 — Dashboard Edition" \
            --notes-file RELEASE-NOTES.md \
            --prerelease
