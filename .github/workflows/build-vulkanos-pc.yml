name: Build VulkanOS PC Alpha

on:
  push:
    branches: [main]
    paths:
      - "pc-edition/**"
      - ".github/workflows/build-vulkanos-pc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out VulkanOS sources
        uses: actions/checkout@v4

      - name: Build Debian Live ISO in a clean Trixie container
        run: |
          docker run --privileged --rm \
            --volume "$GITHUB_WORKSPACE/pc-edition:/work" \
            --workdir /work \
            debian:trixie-slim \
            bash -lc '
              set -eux
              apt-get update
              apt-get install -y --no-install-recommends \
                bash ca-certificates curl python3 python3-gi gir1.2-gtk-3.0 \
                gir1.2-gdkpixbuf-2.0 librsvg2-common xvfb xauth \
                live-build debootstrap \
                xorriso squashfs-tools \
                syslinux-common syslinux-utils isolinux \
                grub-pc-bin grub-efi-amd64-bin grub-efi-ia32-bin \
                dosfstools mtools e2fsprogs \
                xz-utils bzip2 rsync file gnupg
              bash -n ./build.sh ./config/hooks/normal/*.hook.chroot ./config/includes.chroot/usr/local/bin/vulkanos-session-start
              PYTHONPYCACHEPREFIX=/tmp/vulkanos-pycache python3 -m py_compile "$PWD/config/includes.chroot/usr/local/bin/vulkanos-dashboard"
              python3 - <<'PY'
              import pathlib
              import xml.etree.ElementTree as ET
              for svg in pathlib.Path("config/includes.chroot").rglob("*.svg"):
                  ET.parse(svg)
              print("All VulkanOS SVG resources are valid")
              PY
              VULKANOS_RESOURCE_DIR="$PWD/config/includes.chroot/usr/share/backgrounds/vulkanos" \
              VULKANOS_SCREENSHOT_PATH="$PWD/dashboard-preview.png" \
                xvfb-run -a -s "-screen 0 1280x720x24" /usr/bin/python3 "$PWD/config/includes.chroot/usr/local/bin/vulkanos-dashboard" --smoke-test
              test -s dashboard-preview.png
              bash ./build.sh
            '

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: VulkanOS-PC-Alpha-0.1-amd64
          path: |
            pc-edition/VulkanOS-PC-Alpha-0.1-amd64.iso
            pc-edition/SHA256SUMS
            pc-edition/dashboard-preview.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 14